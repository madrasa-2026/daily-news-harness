<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>
  
  <!-- Icon Emblem -->
  <g transform="translate(10, 10)">
    <!-- Shield / Badge Base -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#emeraldGrad)" />
    <!-- Dynamic Red Accent Wing -->
    <path d="M 50 15 L 85 50 L 50 85 L 35 70 L 60 50 L 35 30 Z" fill="url(#crimsonGrad)" opacity="0.95" />
    <!-- Center Quill / Spark -->
    <circle cx="45" cy="50" r="14" fill="#ffffff" />
    <circle cx="45" cy="50" r="7" fill="#dc2626" />
  </g>

  <!-- Typography: Bengali Name -->
  <text x="125" y="70" font-family="'Hind Siliguri', 'Noto Sans Bengali', 'SolaimanLipi', sans-serif" font-size="56" font-weight="900" fill="#047857" letter-spacing="-0.5">
    জন<tspan fill="#dc2626">বার্তা</tspan>
  </text>
  
  <!-- English Tagline & Slogan -->
  <text x="128" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#64748b" letter-spacing="3.5">
    JONOBARTA • সত্য ও ন্যায়ের কণ্ঠ
  </text>
</svg>
